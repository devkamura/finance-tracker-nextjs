services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: finance_tracker_web_prod
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-finance_tracker}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: finance_tracker_db_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finance_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # 本番ではDBを外部公開しない

volumes:
  postgres_data_prod:
